name: Verify training app
on:
  pull_request:
    paths:
      - 'training-app/**'
      - 'rehab-training/**'
      - '.github/workflows/build-rehab-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: training-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed static output
        run: |
          git diff --exit-code -- ../rehab-training
          test -z "$(git ls-files --others --exclude-standard ../rehab-training)"
